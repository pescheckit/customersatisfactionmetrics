name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]

jobs:
  lint:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Pipenv
        run: |
          python -m pip install --upgrade pip
          pip install pipenv ruff
      - name: Install dependencies with Pipenv
        run: |
          pipenv install --dev
      - name: Analysing the code with pylint
        run: |
          pipenv run pylint $(git ls-files '*.py')
      - name: Check import order with isort
        run: |
          pipenv run isort --check-only --diff .
      - name: Linting with Ruff
        run: |
          ruff check $(git ls-files '*.py')

  test:
    needs: lint
    runs-on: ubuntu-22.04
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Pipenv and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
      - name: Install dependencies with Pipenv
        run: |
          pipenv install --dev
      - name: Run migrations
        run: |
          pipenv run python manage.py migrate
      - name: Run Tests
        run: |
          pipenv run python manage.py test customersatisfactionmetrics

  deploy:
    needs: test
    runs-on: ubuntu-22.04
    if: github.event_name == 'release' && github.event.action == 'published'
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install Pipenv
        run: python -m pip install --upgrade pipenv
      - name: Install dependencies with Pipenv
        run: |
          pipenv install --dev
      - name: Build package
        run: pipenv run python -m build src/
      - name: Verify the release tag matches the packaged version
        # The version lives in src/setup.py and nothing derives it from the tag,
        # so releasing 1.1.1 while setup.py still said 1.1.0 published 1.1.0.
        # Fail here rather than silently uploading the wrong version, which PyPI
        # will not let us take back.
        run: |
          packaged="$(basename src/dist/*.tar.gz .tar.gz | sed -E 's/^.*-//')"
          echo "tag=${GITHUB_REF_NAME} packaged=${packaged}"
          if [ "${packaged}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match the version in \
          src/setup.py (${packaged}). PyPI would receive ${packaged}. Update src/setup.py."
            exit 1
          fi
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: src/dist/
